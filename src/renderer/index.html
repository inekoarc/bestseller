<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>爆款采集</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">爆</div>
    <div class="brand-text">
      <div class="brand-title">爆款采集</div>
      <div class="brand-sub">淘宝 · 京东 · 拼多多 · 抖音商城</div>
    </div>
  </div>
  <div class="status" id="status">未启动</div>
</header>

<nav class="steps" id="steps">
  <span class="step active" data-step="1"><span class="dot">1</span><span class="label">选平台</span></span>
  <span class="sep"></span>
  <span class="step" data-step="2"><span class="dot">2</span><span class="label">登录</span></span>
  <span class="sep"></span>
  <span class="step" data-step="3"><span class="dot">3</span><span class="label">配置</span></span>
  <span class="sep"></span>
  <span class="step" data-step="4"><span class="dot">4</span><span class="label">采集</span></span>
</nav>

<main class="main">

  <section class="panel" id="panel-pick">
    <div class="panel-title">选择平台</div>
    <div class="platforms" id="platforms"></div>
    <div class="hint">京东必须先扫码登录；拼多多为移动端 H5，首次使用需手机验证码登录。</div>
  </section>

  <section class="panel hidden" id="panel-login">
    <div class="panel-title">登录</div>
    <div class="login-grid">
      <div class="qr-wrap" id="qr-wrap">
        <div class="qr-frame">
          <img id="qr-img" alt="二维码" />
          <div class="qr-empty" id="qr-placeholder">正在打开登录页...</div>
        </div>
        <div class="qr-tip">用手机 <strong id="login-app-name">对应 APP</strong> 扫码</div>
      </div>
      <div class="login-status">
        <div class="status-line" id="login-status-line">等待中</div>
        <div class="sms-form hidden" id="sms-form">
          <div class="input-row">
            <input type="text" id="sms-phone" maxlength="11" placeholder="手机号">
            <button class="btn" id="btn-sms-send">发送验证码</button>
          </div>
          <div class="input-row">
            <input type="text" id="sms-code" maxlength="8" placeholder="短信验证码">
            <button class="btn primary" id="btn-sms-login">登录</button>
          </div>
          <div class="sms-tip">扫码扫不出或被风控时，可改用短信验证码登录。首次登录后登录态保留在本地，之后无需重复登录。</div>
          <div class="login-actions">
            <button class="btn ghost" id="btn-cancel-sms">取消</button>
          </div>
        </div>
        <div class="qr-info" id="qr-info"></div>
        <div class="login-log" id="login-log"></div>
        <div class="login-actions">
          <button class="btn" id="btn-recheck">我已扫码，刷新</button>
          <button class="btn ghost hidden" id="btn-switch-sms">改用短信验证码登录</button>
          <button class="btn ghost" id="btn-cancel-login">取消</button>
        </div>
      </div>
    </div>
  </section>

  <section class="panel hidden" id="panel-config">
    <div class="panel-title">采集参数</div>
    <div class="form-grid">
      <label class="field">
        <div class="field-label">关键词（每行一个，或用逗号分隔）</div>
        <textarea id="kw" rows="4" placeholder="例如：&#10;充电器&#10;手机壳"></textarea>
      </label>

      <div class="row">
        <label class="field grow">
          <div class="field-label">每个关键词采集条数</div>
          <input type="number" id="topN" min="1" max="1000" value="50">
        </label>
        <label class="field grow">
          <div class="field-label">输出目录（留空用默认）</div>
          <div class="input-row">
            <input type="text" id="outputDir" placeholder="默认：用户数据目录/output">
            <button class="btn" id="btn-pick-dir">选择文件夹</button>
          </div>
        </label>
      </div>

      <div class="row options">
        <label class="checkbox">
          <input type="checkbox" id="splitByKeyword">
          <span>按关键词拆分子表</span>
        </label>
        <label class="checkbox">
          <input type="checkbox" id="fetchDetail">
          <span>搜索页无销量时，进详情页补采（京东可能很慢）</span>
        </label>
        <label class="checkbox" id="row-experimental" hidden>
          <input type="checkbox" id="allowExperimental">
          <span id="experimental-text">启用实验性平台</span>
        </label>
      </div>

      <div class="row actions">
        <button class="btn primary" id="btn-start">开始采集</button>
        <button class="btn ghost" id="btn-back-pick">返回选平台</button>
      </div>
    </div>
  </section>

  <section class="panel hidden" id="panel-collect">
    <div class="panel-title">采集中</div>

    <div class="progress-wrap">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-text" id="progress-text">0 / 0</div>
    </div>

    <div class="row controls">
      <button class="btn" id="btn-pause">暂停</button>
      <button class="btn danger" id="btn-stop">停止并保存</button>
    </div>

    <div class="log-box" id="log-box"></div>

    <div class="done-area hidden" id="done-area">
      <div class="done-title">✓ 采集完成</div>
      <div class="done-path" id="done-path"></div>
      <div class="done-actions">
        <button class="btn" id="btn-open-file">打开 Excel</button>
        <button class="btn" id="btn-open-folder">打开所在文件夹</button>
        <button class="btn ghost" id="btn-new-task">再来一次</button>
      </div>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
